name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Windows Config
        if: matrix.os == 'windows-2022'
        run: |
          git config --system core.longpaths true
          echo "Enabled long paths in git"

          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          echo "Enabled long paths in registry"

          $git_link = "C:\Program Files\Git\usr\bin\link.exe"
          if (Test-Path $git_link) {
              Rename-Item $git_link "_link.exe"
          }
          echo "Removed link.exe in git"

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.29
          arch: x64
          sdk: 10.0.19041.0

      - name: Checkout notepad4
        uses: actions/checkout@v6
        with:
          repository: zufuliu/notepad4
          ref: refs/tags/v25.11r5880
          path: notepad4

      - name: AVX2 & AVX512
        working-directory: "notepad4/build/VisualStudio"
        run: |
          msbuild Notepad4.sln `
          /p:Platform=x64 `
          /p:PlatformToolset=v142 `
          /p:WindowsTargetPlatformVersion=10.0.19041.0 `
          /p:WholeProgramOptimization=true `
          /p:Optimization=MinSpace `
          /p:FunctionLevelLinking=true
          /p:Configuration=AVX2Release `

          msbuild Notepad4.sln `
          /p:Platform=x64 `
          /p:PlatformToolset=v142 `
          /p:WindowsTargetPlatformVersion=10.0.19041.0 `
          /p:WholeProgramOptimization=true `
          /p:Optimization=MinSpace `
          /p:FunctionLevelLinking=true
          /p:Configuration=AVX512Release `

      - name: Archive AVX2
        uses: actions/upload-artifact@v5
        with:
          name: notepad4_avx2
          path: |
            notepad4/build/bin/Release/AVX2/**/*.exe
            notepad4/build/bin/Release/AVX2/**/*.dll

      - name: Archive AVX512
        uses: actions/upload-artifact@v5
        with:
          name: notepad4__avx512
          path: |
            notepad4/build/bin/Release/AVX512/**/*.exe
            notepad4/build/bin/Release/AVX512/**/*.dll
