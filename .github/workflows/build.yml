name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Windows Config
        if: matrix.os == 'windows-2022'
        run: |
          git config --system core.longpaths true
          echo "Enabled long paths in git"

          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          echo "Enabled long paths in registry"

          $git_link = "C:\Program Files\Git\usr\bin\link.exe"
          if (Test-Path $git_link) {
              Rename-Item $git_link "_link.exe"
          }
          echo "Removed link.exe in git"

      - name: Setup MSVC
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.29
          arch: x64
          sdk: 10.0.19041.0

      - name: Checkout self
        uses: actions/checkout@v4

      - name: Checkout gitoxide
        uses: actions/checkout@v4
        with:
          repository: GitoxideLabs/gitoxide
          ref: refs/tags/v0.47.0
          path: gitoxide

      - name: Copy config file
        shell: bash
        run: |
          mkdir -p gitoxide/.cargo
          cp -f .cargo/config.toml gitoxide/.cargo

      - name: Build
        shell: pwsh
        run: |
          cd gitoxide
          Remove-Item -Force Cargo.lock
          cargo update
          cargo b -r

      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: gitoxide_${{ matrix.os }}
          path: |
            gitoxide/target/release/*.exe

            gitoxide/target/release/ein
            gitoxide/target/release/gix

            gitoxide/target/release/*.dll
            gitoxide/target/release/*.so
